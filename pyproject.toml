[project]
name = "dataanalproj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abbourne", email = "wbbourne@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
dataanalproj = "dataanalproj:main"

[tool.pytest.ini_options]
pythonpath = "src"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
    "ty>=0.0.9",
]
